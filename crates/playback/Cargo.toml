[package]
name = "soundcraft-playback"
description = "SoundCraft audio device I/O: realtime playback and recording through the mix engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
soundcraft-time.workspace = true
soundcraft-audio-io.workspace = true
soundcraft-model.workspace = true
soundcraft-mix.workspace = true
soundcraft-dsp.workspace = true
log.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal.workspace = true
# The ASIO driver's buffer sizes and control panel (with the `asio` feature).
soundcraft-asio-host = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }

[features]
# ASIO on Windows (cpal's ASIO host). Off for this crate; the `soundcraft` app turns it on by
# default. Building it downloads Steinberg's ASIO SDK (its own licence) and needs LLVM (libclang)
# for the bindings.
asio = ["cpal/asio", "dep:soundcraft-asio-host"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
