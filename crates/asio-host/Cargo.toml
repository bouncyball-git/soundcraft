[package]
name = "soundcraft-asio-host"
description = "SoundCraft ASIO driver helpers: the loaded driver's buffer sizes and its control panel, which cpal does not expose (an isolated unsafe FFI crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# The ASIO SDK code this crate calls is compiled by asio-sys (the same instance cpal's ASIO host
# uses), so both act on the one driver ASIO allows a process to load.
[target.'cfg(all(windows, target_env = "msvc"))'.dependencies]
asio-sys = "0.4.0"

# An isolated unsafe helper crate (craftrules never-crash), like soundcraft-au-host: this crate
# opts out of the workspace `unsafe_code = "forbid"` for itself only. It denies unsafe everywhere
# and allows it solely on the FFI module (`src/ffi.rs`). The rest mirrors `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "deny"
type_complexity = "allow"
